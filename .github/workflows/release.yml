# 手动触发发版：在 GitHub Actions 页面运行，或在本地执行
#   gh workflow run release.yml -f version=v1.0.2
# 构建 APK 并发布到 GitHub Releases（tag 不存在时自动创建）。
# 应用内「检查更新」读取最新 Release 的 tag 与 APK 资产。
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（如 v1.0.2）'
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: bash ./gradlew :app:assembleDebug --no-daemon

      - name: Rename APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk \
             calm-schedule-${{ inputs.version }}.apk

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          files: calm-schedule-*.apk
          generate_release_notes: true
