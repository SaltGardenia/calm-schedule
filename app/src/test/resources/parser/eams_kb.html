<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>我的课表</title></head>
<body>
<div class="course-table">
  <div class="time-table">
    <div class="time-table-title">
      <div class="layout-title"></div>
      <div class="weekday-title" style="width: 13.1429%;">星期一</div>
      <div class="weekday-title" style="width: 13.1429%;">星期二</div>
      <div class="weekday-title" style="width: 13.1429%;">星期三</div>
      <div class="weekday-title" style="width: 13.1429%;">星期四</div>
      <div class="weekday-title" style="width: 13.1429%;">星期五</div>
      <div class="weekday-title" style="width: 13.1429%;">星期六</div>
      <div class="weekday-title" style="width: 13.1429%;">星期日</div>
    </div>
    <div class="time-table-body">
      <div class="columns time-segment">
        <div style="height: 60px;"><span>8:00</span></div>
        <div style="height: 60px;"><span>9:00</span></div>
        <div style="height: 60px;"><span>10:00</span></div>
        <div style="height: 60px;"><span>11:00</span></div>
      </div>
      <div class="columns weekday">
        <div class="card-view common-card un-draggable" draggable="false" style="left: 0%; width: 100%; top: 0px; height: 100px;">
          <div class="card-content">
            <strong style="color: #737373">CS101--001</strong>
            <p>数据结构<br>     教1楼101(9~12周),机房B（临时）(1~4周)          &nbsp;          1&nbsp;(1,2)        </p>
          </div>
        </div>
      </div>
      <div class="columns weekday">
        <div class="card-view common-card un-draggable" draggable="false" style="left: 0%; width: 100%; top: 120px; height: 100px;">
          <div class="card-content">
            <strong style="color: #737373">CS102--001</strong>
            <p>操作系统<br>     教2楼202 &nbsp;(5~16周) &nbsp; 2&nbsp;(3,4)        </p>
          </div>
        </div>
      </div>
      <div class="columns weekday"></div>
      <div class="columns weekday"></div>
      <div class="columns weekday"></div>
      <div class="columns weekday"></div>
      <div class="columns weekday"></div>
    </div>
  </div>
</div>
</body>
</html>
